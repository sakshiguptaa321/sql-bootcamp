services:
  oracle-free:
    image: gvenzl/oracle-free:23.26.3-slim
    container_name: learning-sql-oracle
    env_file:
      - ../.env
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYSTEM_PASSWORD}
      APP_USER: ${ORACLE_USER}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD}
    volumes:
      - learning-sql-oracle-data:/opt/oracle/oradata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  learning-sql-oracle-data:
    name: learning-sql-oracle-data
