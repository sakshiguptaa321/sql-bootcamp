[project]
name = "learning-sql"
version = "0.1.0"
description = "SQL practice with SQLite in Jupyter notebooks"
requires-python = ">=3.11"
dependencies = [
    "contextily>=1.7.0",
    "folium>=0.20",
    "geopandas>=1.1.0",
    "ipykernel>=6.29",
    "ipython-sql>=0.5.0",
    "matplotlib>=3.10",
    "oracledb>=26.1.0",
    "pandas>=2.2",
    "prettytable<3.12",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[tool.uv]
package = false
